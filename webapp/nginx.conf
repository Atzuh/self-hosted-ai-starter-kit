server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------
    # n8n-webhooks onder hetzelfde adres als de webapp.
    # De webapp roept /webhook/... relatief aan, zodat hij ook werkt wanneer
    # hij via een ander adres dan localhost wordt geopend (bv. de
    # Tailscale-naam van deze Mac). Alleen /webhook/ gaat door: de n8n-editor
    # zelf blijft uitsluitend op poort 5678 van de Mac bereikbaar.
    #
    # De variabele + resolver laten nginx de naam 'n8n' per verzoek opzoeken
    # via Docker-DNS. Met een vaste proxy_pass start nginx niet als n8n nog
    # niet draait, en blijft het een oud adres gebruiken nadat de container
    # opnieuw is aangemaakt.
    # ---------------------------------------------------------
    location /webhook/ {
        resolver 127.0.0.11 valid=10s;
        set $n8n http://n8n:5678;
        proxy_pass $n8n;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Dossiers en opnames van besprekingen zijn groot; direct doorsturen
        # in plaats van eerst op schijf te bufferen.
        client_max_body_size 2g;
        proxy_request_buffering off;
        # Een generatie kan minuten duren voordat n8n antwoordt.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Browsers eisen een geldig JS-MIME type voor ES-module imports (zoals de
    # pdf.js worker). De default nginx mime.types kent .mjs niet, dus we
    # mappen hem expliciet via default_type binnen een location-match.
    location ~* \.mjs$ {
        default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # ---------------------------------------------------------
    # Gegenereerde aktes uit de shared-volume (read-only mount)
    # Beschikbaar op http://host/output/<bestand>
    # Een GET op /output/ levert een JSON-listing (autoindex) die de
    # webapp gebruikt voor de "Recente aktes"-lijst.
    # ---------------------------------------------------------
    location /output/ {
        alias /shared/output/;
        autoindex on;
        autoindex_format json;
        add_header Access-Control-Allow-Origin *;
    }

    # ---------------------------------------------------------
    # Bank-templates (read-only) — zodat de gebruiker het actieve
    # .docx-template kan inzien/downloaden vanaf de Templates-pagina.
    # Beschikbaar op http://host/templates/<bank>/<bestand>.docx
    # ---------------------------------------------------------
    location /templates/ {
        alias /shared/templates/;
        autoindex off;
        add_header Access-Control-Allow-Origin *;
    }

    # Optioneel: inspecteer andere shared bestanden (handig bij debuggen)
    location /files/ {
        alias /shared/;
        autoindex on;
        add_header Access-Control-Allow-Origin *;
    }

    # ---------------------------------------------------------
    # React single-page app met client-side routing fallback
    # ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin *;
    }

    # Lange cache voor gehashte assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
